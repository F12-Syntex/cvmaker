name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (Maven)
        env:
          # Unit tests never launch a browser, so skip Playwright's browser download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: mvn -B verify

      # Node 20: `node --test <directory>` searches the directory for test files.
      # From Node 21 on, arguments are globs and a bare directory is run as a module.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test browser extension (node --test)
        run: |
          tests=$(find auto-apply-plugin -type f \( -name '*.test.*js' -o -name '*-test.*js' \
            -o -name '*_test.*js' -o -name 'test-*.*js' -o -name 'test.*js' -o -path '*/test/*.*js' \))
          if [ -n "$tests" ]; then
            node --test auto-apply-plugin/
          else
            echo "No node tests in auto-apply-plugin/ yet; skipping."
          fi
